spring:
  application:
    name: ticketbooking

  datasource:
    url: jdbc:postgresql://localhost:5433/ticketbooking
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: 8080

jwt:
  secret: change-this-to-a-long-random-secret-at-least-32-chars
  expiration-ms: 3600000