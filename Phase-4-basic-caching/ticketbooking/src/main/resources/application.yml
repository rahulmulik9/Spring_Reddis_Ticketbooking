spring:
  application:
    name: ticketbooking

  datasource:
    url: jdbc:postgresql://localhost:5433/ticketbooking
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

server:
  port: 8080

jwt:
  secret: change-this-to-a-long-random-secret-at-least-32-chars
  expiration-ms: 3600000